[project]
name = "stockroom"
version = "2.0.0"
description = "Warehouse stock reservation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
